<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dualtarot | Reserva tu sesión</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

    <div class="nav-links">
    <a href="sobre-mi.html" class="sobre-mi-link">✨ Sobre mí</a>
    </div>

  <div class="card">
    <h2>🔮 Sesiones privadas Dualtarot</h2>
    <p class="subtitle">Reserva tu cita y descubre lo que las cartas tienen para ti</p>
    <form id="formReserva">
        <div class="form-row">
            <input type="text" name="nombre" id="nombre" placeholder="Nombre" required>
            <input type="text" name="apellidos" id="apellidos" placeholder="Apellidos">
        </div>
        <input type="text" name="instagram" id="instagram" placeholder="Usuario de Instagram" required>
        <input type="text" name="telefono" id="telefono" placeholder="Teléfono móvil (Opcional)">
        <input type="email" name="email" id="email" placeholder="Email (Opcional)">
        
        <label for="citaSelect">Selecciona tu cita:</label>
        <select name="disponibilidadId" id="citaSelect" required>
            <option value="" disabled selected>-- Elige un día y hora --</option>
            <option th:each="h : ${huecosDisponibles}" 
                    th:value="${h.id}" 
                    th:text="${#temporals.format(h.fechaHora, 'dd/MM/yyyy HH:mm')}">
            </option>
        </select>
        
        <button type="button" onclick="procesarReserva()">Reservar y Pagar</button>
    </form>    
</div>
  <script>
    function procesarReserva() {
        const form = document.getElementById('formReserva');
        
        if (!form.checkValidity()) {
            form.reportValidity();
            return;
        }

        const formData = new FormData(form);
        
        // Se guarda la cita primero
        fetch('/guardar', {
            method: 'POST',
            body: formData
        })
        .then(response => {
            if (!response.ok) throw new Error("Error al guardar la reserva");
            return response.json(); 
        })
        .then(data => {
            // data.citaId es el ID REAL que nos acaba de dar Java tras el save
            if (data.status === 'ok' && data.citaId) {
                
                // 2. Ahora pedimos la URL de Stripe usando EL ID DE LA CITA
                return fetch('/crear-sesion-pago?citaId=' + data.citaId, { method: 'POST' });
            } else {
                throw new Error("No se recibió el ID de la cita");
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.url) {
                window.location.href = data.url; // ¡A pagar con el ID correcto!
            } else {
                alert("Error en la pasarela: " + data.error);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert("Hubo un problema: " + error.message);
        });
    }
</script>
</body>
</html>
