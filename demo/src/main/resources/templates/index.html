<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dualtarot</title>
    <meta charset="UTF-8">
    <title>Cita Tarot</title>
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
    
    <div class="nav-links">
    <a href="sobre-mi.html" class="sobre-mi-link">✨ Sobre mí</a>
    </div>

  <div class="card">
    <h2>Sesiones privadas Dualtarot</h2>
    <form id="formReserva">
        <input type="text" name="nombre" id="nombre" placeholder="Nombre" required>
        <input type="text" name="apellidos" id="apellidos" placeholder="Apellidos">
        <input type="text" name="instagram" id="instagram" placeholder="Usuario de Instagram" required>
        <input type="text" name="telefono" id="telefono" placeholder="Teléfono móvil (Opcional)">
        <input type="email" name="email" id="email" placeholder="Email (Opcional)">
        
        <label for="citaSelect">Selecciona tu cita:</label>
        <select name="disponibilidadId" id="citaSelect" required>
            <option value="" disabled selected>-- Elige un día y hora --</option>
            <option th:each="h : ${huecosDisponibles}" 
                    th:value="${h.id}" 
                    th:text="${#temporals.format(h.fechaHora, 'dd/MM/yyyy HH:mm')}">
            </option>
        </select>
        
        <button type="button" onclick="procesarReserva()">Reservar y Pagar</button>
    </form>    
</div>
  <script>
    function procesarReserva() {
        const form = document.getElementById('formReserva');
        const citaId = document.getElementById('citaSelect').value;

        if (!form.checkValidity()) {
            form.reportValidity(); // Muestra los avisos de "campo requerido" si falta algo
            return;
        }

        // 1. Enviamos los datos del formulario a tu controlador actual para guardar la cita
        const formData = new FormData(form);
        
        fetch('/guardar', {
            method: 'POST',
            body: formData
        })
        .then(response => {
            if (response.ok) {
                // 2. Si se guardó bien, ahora pedimos la URL de Stripe
                return fetch('/crear-sesion-pago?citaId=' + citaId, { method: 'POST' });
            }
            throw new Error("Error al guardar la reserva");
        })
        .then(response => response.json())
        .then(data => {
            if (data.url) {
                window.location.href = data.url; // ¡A pagar!
            } else {
                alert("Error en la pasarela: " + data.error);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert("Hubo un problema al procesar la reserva");
        });
    }
</script>
</body>
</html>
