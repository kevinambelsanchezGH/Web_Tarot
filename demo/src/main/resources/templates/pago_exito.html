<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>¡Reserva Confirmada!</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; }
        .card { border: 1px solid #ddd; padding: 20px; display: inline-block; border-radius: 10px; }
        .btn { background: #28a745; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>¡Pago completado! ✅</h1>
        <p>Gracias <strong th:text="${nombre}">Usuario</strong>, tu cita ya está confirmada.</p>
        <br>
        <a href="/" class="btn">Volver a la web</a>
    </div>
</body>
</html>
