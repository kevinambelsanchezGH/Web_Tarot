spring.application.name=demo

# Si encuentra la variable de Docker la usa; si no, usa el localhost de mi PC con mis datos reales
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tarot_db?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:***REMOVED***}

# Actualiza el esquema de la base de datos automáticamente según las entidades (crea/ajusta tablas)
spring.jpa.hibernate.ddl-auto=update
# Muestra por consola las consultas SQL que genera Hibernate (útil para depurar)
spring.jpa.show-sql=true
# Dialecto SQL que usa Hibernate para traducir a MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Dónde están las plantillas HTML (Thymeleaf) y con qué extensión
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
# Desactiva la caché de plantillas para ver los cambios sin reiniciar (cómodo en desarrollo)
spring.thymeleaf.cache=false

# Clave secreta de Stripe (modo test) usada por PagoController para crear sesiones de pago
stripe.api.key=${STRIPE_API_KEY:clave_no_configurada}
admin.username=${ADMIN_USERNAME:***REMOVED***}
admin.password=${ADMIN_PASSWORD:***REMOVED***}

# SMTP de Gmail para el email de confirmación de cita (usar una "contraseña de aplicación", no la del login normal)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cuenta de servicio de Google para crear el evento en el calendario compartido
google.calendar.credentials-path=${GOOGLE_CALENDAR_CREDENTIALS_PATH:}
google.calendar.calendar-id=${GOOGLE_CALENDAR_ID:}
google.calendar.event-duration-minutes=${GOOGLE_CALENDAR_EVENT_DURATION:60}

# Minutos que se espera el pago de una reserva antes de liberar el hueco automáticamente
reserva.expiracion-minutos=${RESERVA_EXPIRACION_MINUTOS:10}
