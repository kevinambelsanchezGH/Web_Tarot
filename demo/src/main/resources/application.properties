spring.application.name=demo

# Si encuentra la variable de Docker la usa; si no, usa el localhost de mi PC con mis datos reales
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tarot_db?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:***REMOVED***}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

stripe.api.key=***REMOVED***